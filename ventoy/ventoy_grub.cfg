menuentry "NixOS Portable" --class nixos {
    set root='(hd0,gpt3)'
    terminal_output console
    if [ -f /EFI/systemd/systemd-bootx64.efi ]; then
        chainloader /EFI/systemd/systemd-bootx64.efi
    elif [ -f /EFI/BOOT/BOOTX64.EFI ]; then
        chainloader /EFI/BOOT/BOOTX64.EFI
    else
        echo "NixOS Bootloader not found."
        sleep 5
    fi
}

menuentry "---------------------------------------------------" {
    true
}


menuentry "Press Esc for ISO list." --class debug {
    echo "Returning to main menu..."
    sleep 1
}
